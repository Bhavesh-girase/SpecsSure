services:
  db:
    image: pgvector/pgvector:pg16
    container_name: specsure-db
    environment:
      POSTGRES_USER: bharatstandards
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bharatstandards
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatstandards -d bharatstandards"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: specsure-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://bharatstandards:password@db:5432/bharatstandards
      - DATABASE_URL_SYNC=postgresql://bharatstandards:password@db:5432/bharatstandards
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      - EMBEDDING_DIMENSION=1024
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - FRONTEND_URL=http://localhost:3000
      - SEED_DEMO=1
      - LOG_LEVEL=INFO
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - specsure-keys:/app/var
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: specsure-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  specsure-keys:
